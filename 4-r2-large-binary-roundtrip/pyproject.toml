[project]
name = "r2-large-binary-roundtrip"
version = "0.1.0"
description = "Reproduction: large R2 binary round-trip through Python crashes Worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # fastapi 0.142 imports opentelemetry-api, which calls uuid4() at import time.
    # Python Workers forbid randomness during startup, and this Worker imports
    # FastAPI at module level, so it fails to load.
    "fastapi<0.142",
]

[dependency-groups]
dev = [
    "workers-py==1.17.7",
    "workers-runtime-sdk"
]
