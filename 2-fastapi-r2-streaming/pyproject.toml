[project]
name = "fastapi-r2-streaming"
version = "0.1.0"
description = "FastAPI + R2 streaming example — demonstrates StreamingResponse truncation bug"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "webtypy>=0.1.7",
    # fastapi 0.142 imports opentelemetry-api, which calls uuid4() at import time.
    # Python Workers forbid randomness during startup, so the Worker fails to load.
    "fastapi<0.142",
    "workers-runtime-sdk>=1.1.1",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk"
]
