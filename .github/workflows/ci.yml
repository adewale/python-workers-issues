name: CI
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: |
        uv sync --dev
        # Warm every repro directory (uv env, vendored Python packages, npx wrangler)
        # so the dev-server startup budget in tests/conftest.py is not spent on installs.
        for dir in [0-9]*-*/; do
          (cd "$dir" && uv run pywrangler dev --help)
        done

    - name: Run tests
      run: uv run pytest -vv

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: uv sync --dev

    - name: pre-commit (ruff, ruff format, codespell, hygiene hooks)
      run: uv run pre-commit run --all-files --show-diff-on-failure
